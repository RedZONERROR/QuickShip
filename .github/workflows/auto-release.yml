name: Auto Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/**'
      - 'LICENSE'

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml

  auto-release:
    name: Auto Version and Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Determine version bump
        id: bump
        run: |
          # Get the last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Last tag: $LAST_TAG"
          
          # Remove 'v' prefix
          LAST_VERSION=${LAST_TAG#v}
          
          # Split version into parts
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
          
          # Get commit messages since last tag
          COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")
          
          # Determine bump type based on commit messages
          BUMP_TYPE="patch"
          
          if echo "$COMMITS" | grep -qiE "^(breaking|major):"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -qiE "^(feat|feature):"; then
            BUMP_TYPE="minor"
          fi
          
          # Calculate new version
          case $BUMP_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_TAG="v$NEW_VERSION"
          
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          
          echo "Bump type: $BUMP_TYPE"
          echo "New version: $NEW_VERSION"
      
      - name: Update VERSION file
        run: |
          echo "${{ steps.bump.outputs.new_version }}" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]" || true
          git push || true
      
      - name: Generate release notes
        id: notes
        run: |
          LAST_TAG="${{ steps.bump.outputs.last_tag }}"
          
          if [ "$LAST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # Categorize commits
          FEATURES=$(echo "$COMMITS" | grep -iE "^- (feat|feature):" || echo "")
          FIXES=$(echo "$COMMITS" | grep -iE "^- (fix|bugfix):" || echo "")
          BREAKING=$(echo "$COMMITS" | grep -iE "^- (breaking|major):" || echo "")
          OTHERS=$(echo "$COMMITS" | grep -viE "^- (feat|feature|fix|bugfix|breaking|major|chore):" || echo "")
          
          cat > release_notes.md << 'EOF'
          ## QuickShip ${{ steps.bump.outputs.new_version }}
          
          ### 🚀 Release Type: ${{ steps.bump.outputs.bump_type }}
          
          EOF
          
          if [ -n "$BREAKING" ]; then
            cat >> release_notes.md << 'EOF'
          ### ⚠️ Breaking Changes
          
          EOF
            echo "$BREAKING" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          if [ -n "$FEATURES" ]; then
            cat >> release_notes.md << 'EOF'
          ### ✨ New Features
          
          EOF
            echo "$FEATURES" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          if [ -n "$FIXES" ]; then
            cat >> release_notes.md << 'EOF'
          ### 🐛 Bug Fixes
          
          EOF
            echo "$FIXES" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          if [ -n "$OTHERS" ]; then
            cat >> release_notes.md << 'EOF'
          ### 📝 Other Changes
          
          EOF
            echo "$OTHERS" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          cat >> release_notes.md << 'EOF'
          
          ### 📦 Installation
          
          ```bash
          cd /opt
          git clone https://github.com/RedZONERROR/QuickShip.git quickship
          cd quickship
          git checkout ${{ steps.bump.outputs.new_tag }}
          chmod +x main.sh modules/*.sh
          ./main.sh
          ```
          
          ### 📋 Requirements
          
          - Linux VPS with bash
          - netcat (nc)
          - systemd (for service management)
          - sudo access (for service installation)
          
          **⚠️ Security Warning:** This system has zero authentication. Only use on private networks or trusted environments.
          
          ---
          
          **Full Changelog**: https://github.com/RedZONERROR/QuickShip/compare/${{ steps.bump.outputs.last_tag }}...${{ steps.bump.outputs.new_tag }}
          EOF
      
      - name: Create and push tag
        run: |
          git tag ${{ steps.bump.outputs.new_tag }}
          git push origin ${{ steps.bump.outputs.new_tag }}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.bump.outputs.new_tag }}
          name: QuickShip ${{ steps.bump.outputs.new_version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
