name: Test Perl Script

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  perl-syntax:
    name: Perl Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Perl syntax
        run: |
          perl -c run.pl
      
      - name: Check for warnings
        run: |
          perl -Mwarnings -Mstrict -c run.pl

  security-scan:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for security issues
        run: |
          echo "Checking for dangerous patterns..."
          ! grep -E "(system\(|exec\(|`)" run.pl | grep -v "exec\(\"\./\$UPLOAD_FILE\"\)" || echo "Warning: Potentially dangerous system calls"
          
          echo "Checking for hardcoded credentials..."
          ! grep -iE "(password|secret|api_key)\s*=\s*['\"][^'\"]+['\"]" run.pl || echo "Warning: Potential hardcoded credentials"
          
          echo "✓ Security scan complete"

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for best practices
        run: |
          echo "Checking for strict and warnings..."
          grep -q "use strict;" run.pl && echo "✓ 'use strict' found"
          grep -q "use warnings;" run.pl && echo "✓ 'use warnings' found"
          
          echo "Checking for proper error handling..."
          grep -q "or die" run.pl && echo "✓ Error handling found"
          
          echo "✓ Code quality check complete"
